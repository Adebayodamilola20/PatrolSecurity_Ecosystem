name: patrol_app
description: "QR-based patrol monitoring system for security guards."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.2.0
  geolocator: ^13.0.0
  flutter_secure_storage: ^9.2.0
  http: ^1.2.0
  provider: ^6.1.0
  intl: ^0.20.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  google_fonts: ^6.2.0
  permission_handler: ^11.3.0
  vibration: ^3.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
